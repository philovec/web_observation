name: News Scraper Workflow

on:
  schedule:
    # 毎朝8時（JST）に実行 (UTC時間で 23:00 に指定)
    - cron: '0 * * * *'
  workflow_dispatch: # Actionsの画面から手動実行ボタンを表示

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Pagesやlast_state.jsonの自動コミットに必要

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 💡 playwright を追加インストール
          pip install requests beautifulsoup4 playwright
          
          # 💡 仮想環境内にChromiumブラウザ本体をインストール
          playwright install chromium

      - name: Run Scraper Script
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更がある場合のみ add, commit, push を実行
          git add last_state.json index.html
          # diff-index で変更があるかチェックし、あればコミット
          git diff-index --quiet HEAD || git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
